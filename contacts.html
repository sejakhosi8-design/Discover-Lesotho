<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Discover Lesotho - Contact & Register</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="discoverrlso.css">
</head>
<body>

    <nav class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top shadow-sm">
        <div class="container">
            <a class="nav-logo" href="index.html">
                <img src="flag.jpg" alt="National flag">
            </a>
            <div class="collapse navbar-collapse">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
                    <li class="nav-item"><a class="nav-link" href="about.html">About</a></li>
                    <li class="nav-item"><a class="nav-link" href="heritage.html">Heritage</a></li>
                    <li class="nav-item"><a class="nav-link" href="services.html">Services</a></li>
                    <li class="nav-item"><a class="nav-link" href="gallery.html">Gallery</a></li>
                    <li class="nav-item"><a class="nav-link active" href="contacts.html">Contact</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <main class="container my-5" style="max-width: 700px;">
        <div class="text-center mb-4">
            <h1 class="display-5 fw-bold">Visitor Registration & Inquiry</h1>
            <p class="text-muted">Register an account to book packages or reach out to our tourism team.</p>
        </div>

        <div id="formAlert" class="alert d-none shadow-sm" role="alert"></div>
        
        <div class="card shadow-sm p-4 border-0 bg-white">
            <form id="regForm" novalidate>
                <div class="mb-3">
                    <label for="fullName" class="form-label fw-semibold">Full Name</label>
                    <input type="text" class="form-control" id="fullName" placeholder="Enter your full name" required>
                </div>
                <div class="mb-3">
                    <label for="email" class="form-label fw-semibold">Email Address</label>
                    <input type="email" class="form-control" id="email" placeholder="name@example.com" required>
                </div>
                <div class="mb-3">
                    <label for="phone" class="form-label fw-semibold">Phone Number</label>
                    <input type="tel" class="form-control" id="phone" placeholder="+266 ..." required>
                </div>
                <div class="mb-3">
                    <label for="packageSelect" class="form-label fw-semibold">Interested Package</label>
                    <select class="form-select" id="packageSelect">
                        <option selected>Choose a package...</option>
                        <option value="weekend">Weekend Explorer (M 1,500)</option>
                        <option value="maloti">Maloti Adventure (M 3,200)</option>
                        <option value="heritage">Cultural Heritage (M 2,100)</option>
                    </select>
                </div>
                <div class="mb-3">
                    <label for="password" class="form-label fw-semibold">Password</label>
                    <input type="password" class="form-control" id="password" placeholder="Create a password" required>
                </div>
                <div class="mb-3">
                    <label for="confirmPassword" class="form-label fw-semibold">Confirm Password</label>
                    <input type="password" class="form-control" id="confirmPassword" placeholder="Confirm your password" required>
                </div>
                <button type="submit" class="btn btn-primary w-100 py-2 fw-bold">Submit Registration</button>
            </form>
        </div>
    </main>

    <footer>
        <img src="lesotho_coat_of_arms_transparent_v2.png" alt="Lesotho Code of Arms" class="footer-logo">
        <p>&copy; 2026 Discover Lesotho. All Rights Reserved.</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="jv.js"></script>
</body>
</html>
