<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Discover Lesotho - Gallery</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="discoverrlso.css">
</head>
<body>

    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
              <a href="index.html" class="nav-logo">
                  <img src="flag.jpg" alt="Lesotho Flag">
            </a>
            <div class="collapse navbar-collapse">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
                    <li class="nav-item"><a class="nav-link" href="about.html">About</a></li>
                    <li class="nav-item"><a class="nav-link" href="heritage.html">Heritage</a></li>
                    <li class="nav-item"><a class="nav-link" href="services.html">Services</a></li>
                    <li class="nav-item"><a class="nav-link active" href="gallery.html">Gallery</a></li>
                    <li class="nav-item"><a class="nav-link" href="contacts.html">Contact</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <main class="container my-5">
        <h1 class="text-center mb-4">Photo Gallery</h1>
        <div class="row g-3">
            <div class="col-md-4">
                <img src="Katse dam.jpg" class="img-fluid rounded shadow gallery-img" alt="Katse Dam" data-bs-toggle="modal" data-bs-target="#imageModal">
            </div>
            <div class="col-md-4">
                <img src="The performers, Lesotho.jpg" class="img-fluid rounded shadow gallery-img" alt="Traditional performers" data-bs-toggle="modal" data-bs-target="#imageModal">
            </div>
            <div class="col-md-4">
                <img src="Maliba-Lodge_.Lesotho 🇱🇸..Winter" class="img-fluid rounded shadow gallery-img" alt="Winter view" data-bs-toggle="modal" data-bs-target="#imageModal">
            </div>
        </div>
    </main>

    <!-- Modal for Lightbox preview -->
    <div class="modal fade" id="imageModal" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-body text-center">
                    <img id="modalImage" src="" class="img-fluid" alt="Preview">
                </div>
            </div>
        </div>
    </div>

    <footer>
        <img src="lesotho_coat_of_arms_transparent_v2.png" alt="Lesotho Code of Arms" class="footer-logo">
        <p>&copy; 2026 Discover Lesotho. All Rights Reserved</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="jv.js"></script>
</body>
</html>
